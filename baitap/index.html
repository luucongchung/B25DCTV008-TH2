<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thư Viện Lớp Học</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Header -->
  <header class="header">
    <h1>Thư Viện Lớp Học</h1>
    <div class="favorites-count">
      Yêu thích: <span id="favCount">0</span> ❤️
    </div>
  </header>

  <main class="container">
    <!-- Thanh công cụ -->
    <section class="toolbar">
      <input type="text" id="searchInput" placeholder="Tìm kiếm theo tên sách..." />
      <select id="categoryFilter">
        <option value="">Tất cả thể loại</option>
      </select>
    </section>

    <!-- Dòng trạng thái -->
    <div id="statusText" class="status-text">Đang tải dữ liệu...</div>

    <!-- Lưới thẻ sách -->
    <section id="bookGrid" class="book-grid"></section>

    <!-- Form thêm sách -->
    <section class="add-book-section">
      <h2>Thêm Sách Mới</h2>
      <form id="addBookForm" novalidate>
        <div class="form-group">
          <label for="title">Tên sách:</label>
          <input type="text" id="title" name="title" />
          <span class="error-msg" id="errorTitle"></span>
        </div>

        <div class="form-group">
          <label for="author">Tác giả:</label>
          <input type="text" id="author" name="author" />
          <span class="error-msg" id="errorAuthor"></span>
        </div>

        <div class="form-group">
          <label for="category">Thể loại:</label>
          <select id="category" name="category">
            <option value="">-- Chọn thể loại --</option>
            <option value="Văn học">Văn học</option>
            <option value="Công nghệ">Công nghệ</option>
            <option value="Lịch sử">Lịch sử</option>
            <option value="Kinh tế">Kinh tế</option>
            <option value="Tâm lý">Tâm lý</option>
          </select>
          <span class="error-msg" id="errorCategory"></span>
        </div>

        <div class="form-group">
          <label for="year">Năm xuất bản:</label>
          <input type="number" id="year" name="year" />
          <span class="error-msg" id="errorYear"></span>
        </div>

        <button type="submit">Thêm Sách</button>
      </form>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
